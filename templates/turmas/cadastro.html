{% extends 'base.html' %}
{% block title %}Cadastrar Turma - Sistema Escolar{% endblock %}
{% block page_title %}<i class="bi bi-plus-circle"></i> Cadastrar Turma{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2><i class="bi bi-plus-circle"></i> Nova Turma</h2>
        <p class="page-subtitle">Preencha os dados para criar uma nova turma</p>
    </div>
    <a href="{% url 'lista_turmas' %}" class="btn-modern btn-outline-modern">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="row g-4">
    <div class="col-lg-8">
        <form method="post">
            {% csrf_token %}
            <div class="card-modern">
                <div class="card-header-modern">
                    <h5><i class="bi bi-book"></i> Dados da Turma</h5>
                </div>
                <div class="card-body-modern">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-modern">Nome da Turma *</label>
                                <input type="text" name="nome" class="form-control-modern" placeholder="Ex: 1ºA, 2ºB" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-modern">Nível *</label>
                                <select name="nivel" class="form-control-modern" required>
                                    <option value="">Selecione o nível</option>
                                    <option value="fundamental1">Fundamental I</option>
                                    <option value="fundamental2">Fundamental II</option>
                                    <option value="medio">Médio</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label-modern">Série *</label>
                                <input type="number" name="serie" class="form-control-modern" min="1" max="9" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label-modern">Turno *</label>
                                <select name="turno" class="form-control-modern" required>
                                    <option value="">Selecione o turno</option>
                                    <option value="manha">Manhã</option>
                                    <option value="tarde">Tarde</option>
                                    <option value="noite">Noite</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label-modern">Ano Letivo *</label>
                                <input type="number" name="ano_letivo" class="form-control-modern" value="2026" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-modern">Sala</label>
                                <input type="text" name="sala" class="form-control-modern" placeholder="Ex: Sala 101">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-modern">Capacidade</label>
                                <input type="number" name="capacidade" class="form-control-modern" value="40" min="1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-end mt-4">
                <a href="{% url 'lista_turmas' %}" class="btn-modern btn-outline-modern">Cancelar</a>
                <button type="submit" class="btn-modern btn-primary-modern">
                    <i class="bi bi-check-lg"></i> Criar Turma
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
