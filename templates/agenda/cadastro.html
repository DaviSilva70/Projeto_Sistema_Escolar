{% extends 'base.html' %}
{% block title %}Novo Evento - Sistema Escolar{% endblock %}
{% block page_title %}<i class="bi bi-plus-circle"></i> Novo Evento{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2><i class="bi bi-plus-circle"></i> Novo Evento</h2>
        <p class="page-subtitle">Adicione um evento à agenda da escola</p>
    </div>
    <a href="{% url 'lista_eventos' %}" class="btn-modern btn-outline-modern">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<form method="post">
    {% csrf_token %}
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card-modern">
                <div class="card-header-modern">
                    <h5><i class="bi bi-calendar-event"></i> Dados do Evento</h5>
                </div>
                <div class="card-body-modern">
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="form-group">
                                <label class="form-label-modern">Título *</label>
                                <input type="text" name="titulo" class="form-control-modern" placeholder="Nome do evento" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <label class="form-label-modern">Descrição *</label>
                                <textarea name="descricao" class="form-control-modern" rows="4" placeholder="Descreva o evento" required></textarea>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-modern">Data/Hora Início *</label>
                                <input type="datetime-local" name="data_inicio" class="form-control-modern" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-modern">Data/Hora Fim *</label>
                                <input type="datetime-local" name="data_fim" class="form-control-modern" required>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="form-group">
                                <label class="form-label-modern">Local</label>
                                <input type="text" name="local" class="form-control-modern" placeholder="Ex: Quadra poliesportiva, Sala 101">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label-modern">Cor</label>
                                <input type="color" name="cor" class="form-control-modern form-control-color" value="#4f46e5" style="width: 100%; height: 42px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2 justify-content-end mt-4">
        <a href="{% url 'lista_eventos' %}" class="btn-modern btn-outline-modern">Cancelar</a>
        <button type="submit" class="btn-modern btn-primary-modern">
            <i class="bi bi-check-lg"></i> Criar Evento
        </button>
    </div>
</form>
{% endblock %}
