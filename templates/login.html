<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 40px;
        }
        .login-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
            font-size: 2rem;
        }
        .login-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .login-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 32px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
        }
        .login-form .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            display: block;
        }
        .login-form .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .login-form .form-control:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.5);
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h1 class="login-title">EscolaAdmin</h1>
            <p class="login-subtitle">Sistema de Gestão Escolar</p>

            {% if form.errors %}
            <div class="alert alert-danger d-flex align-items-center gap-2" style="border-radius: 10px; font-size: 0.85rem;">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span>Usuário ou senha inválidos.</span>
            </div>
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="id_username">
                        <i class="bi bi-person"></i> Usuário
                    </label>
                    <input type="text" name="username" class="form-control"
                           id="id_username" placeholder="Digite seu usuário" required autofocus
                           value="{{ form.username.value|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="form-label" for="id_password">
                        <i class="bi bi-lock"></i> Senha
                    </label>
                    <input type="password" name="password" class="form-control"
                           id="id_password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <div class="login-footer">
                <p class="mb-2">
                    <a href="{% url 'cadastro_perfil' %}" style="color: #4f46e5; font-weight: 600; font-size: 0.85rem;">
                        <i class="bi bi-person-plus"></i> Criar minha conta
                    </a>
                </p>
                <p class="mb-0">&copy; 2026 Sistema de Gestão Escolar</p>
            </div>
        </div>
    </div>
</body>
</html>
