{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Aluno - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: 'Inter', sans-serif; }
        .register-card { background: white; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; }
        .register-header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); padding: 32px; text-align: center; color: white; }
        .register-body { padding: 32px; }
        .photo-upload { width: 120px; height: 120px; border-radius: 50%; border: 3px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; margin: 0 auto 16px; overflow: hidden; background: #f8fafc; }
        .photo-upload:hover { border-color: #4f46e5; background: rgba(79,70,229,0.05); }
        .photo-upload img { width: 100%; height: 100%; object-fit: cover; }
        .photo-upload i { font-size: 2rem; color: #94a3b8; }
        .form-label { font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 10px; padding: 10px 14px; border: 1px solid #e2e8f0; font-size: 0.9rem; }
        .form-control:focus, .form-select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .btn-register { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(79,70,229,0.5); color: white; }
        .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
        .step { width: 40px; height: 4px; border-radius: 2px; background: #e2e8f0; }
        .step.active { background: #4f46e5; }
        .card-responsavel { padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .card-responsavel:hover { border-color: #4f46e5; background: rgba(79,70,229,0.03); }
        .card-responsavel.selecionado { border-color: #4f46e5; background: rgba(79,70,229,0.08); }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="register-card">
                    <div class="register-header">
                        <i class="bi bi-person-fill" style="font-size: 2.5rem;"></i>
                        <h3 class="mt-2 mb-1 fw-bold">Cadastro de Aluno</h3>
                        <p class="mb-0 opacity-75">Preencha seus dados para se cadastrar</p>
                    </div>
                    <div class="register-body">
                        <div class="step-indicator">
                            <div class="step active"></div>
                            <div class="step"></div>
                            <div class="step"></div>
                        </div>

                        {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert" style="border-radius: 10px;">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                        {% endif %}

                        <form method="post" enctype="multipart/form-data" id="formAluno">
                            {% csrf_token %}

                            <!-- Foto -->
                            <div class="text-center mb-4">
                                <label for="fotoInput" class="photo-upload" id="photoPreview">
                                    <i class="bi bi-camera-fill"></i>
                                </label>
                                <input type="file" name="foto" id="fotoInput" accept="image/*" style="display: none;" onchange="previewPhoto(this)">
                                <small class="text-muted">Clique para adicionar foto</small>
                            </div>

                            <!-- Dados do Aluno -->
                            <h6 class="fw-bold text-muted mb-3"><i class="bi bi-person"></i> Dados do Aluno</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Nome *</label>
                                    <input type="text" name="first_name" class="form-control" placeholder="Nome" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Sobrenome *</label>
                                    <input type="text" name="last_name" class="form-control" placeholder="Sobrenome" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">RA *</label>
                                    <input type="text" name="ra" class="form-control" placeholder="Ex: 2026001" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">CPF *</label>
                                    <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">RG</label>
                                    <input type="text" name="rg" class="form-control" placeholder="Número do RG">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Data de Nascimento *</label>
                                    <input type="date" name="data_nascimento" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">E-mail</label>
                                    <input type="email" name="email" class="form-control" placeholder="email@exemplo.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Telefone</label>
                                    <input type="text" name="telefone" class="form-control" placeholder="(00) 00000-0000">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Endereço</label>
                                    <textarea name="endereco" class="form-control" rows="2" placeholder="Endereço completo"></textarea>
                                </div>
                            </div>

                            <!-- Responsável -->
                            <h6 class="fw-bold text-muted mb-3"><i class="bi bi-person-check"></i> Responsável</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label class="form-label">Quem é o responsável? *</label>
                                    <select name="tipo_responsavel" id="tipoResponsavel" class="form-select" required onchange="toggleFormResponsavel()">
                                        <option value="">Selecione o parentesco</option>
                                        <option value="mae">Mãe</option>
                                        <option value="pai">Pai</option>
                                        <option value="avo_materno">Avô Materno</option>
                                        <option value="ava_materna">Avó Materna</option>
                                        <option value="avo_paterno">Avô Paterno</option>
                                        <option value="ava_paterna">Avó Paterna</option>
                                        <option value="tio">Tio(a)</option>
                                        <option value="irmao">Irmão(ã)</option>
                                        <option value="tutor">Tutor(a)</option>
                                        <option value="outro">Outro</option>
                                    </select>
                                </div>

                                <div id="formResponsavel" style="display: none; width: 100%;">
                                    <div class="row g-3">
                                        <div class="col-12">
                                            <label class="form-label">Nome Completo do Responsável *</label>
                                            <input type="text" name="nome_responsavel" id="nomeResponsavel" class="form-control" placeholder="Nome completo" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">CPF *</label>
                                            <input type="text" name="cpf_responsavel" id="cpfResponsavel" class="form-control" placeholder="000.000.000-00" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Telefone *</label>
                                            <input type="text" name="telefone_responsavel" id="telefoneResponsavel" class="form-control" placeholder="(00) 00000-0000" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">E-mail</label>
                                            <input type="email" name="email_responsavel" id="emailResponsavel" class="form-control" placeholder="email@exemplo.com">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Endereço Completo *</label>
                                            <textarea name="endereco_responsavel" id="enderecoResponsavel" class="form-control" rows="2" placeholder="Rua, número, bairro, cidade, estado, CEP" required></textarea>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Profissão</label>
                                            <input type="text" name="profissao_responsavel" id="profissaoResponsavel" class="form-control" placeholder="Ex: Professor">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-register mb-3">
                                <i class="bi bi-check-lg"></i> Criar Minha Conta
                            </button>
                        </form>

                        <div class="text-center">
                            <a href="{% url 'cadastro_perfil' %}" class="text-muted text-decoration-none" style="font-size: 0.85rem;">
                                <i class="bi bi-arrow-left"></i> Voltar e escolher outro perfil
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function previewPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photoPreview').innerHTML = '<img src="' + e.target.result + '" alt="Foto">';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleFormResponsavel() {
            const tipo = document.getElementById('tipoResponsavel').value;
            const form = document.getElementById('formResponsavel');
            form.style.display = tipo ? 'block' : 'none';
        }
    </script>
</body>
</html>
